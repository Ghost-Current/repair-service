<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Pro Audit - Financials & PDF</title>
    <!-- jsPDF Engine and AutoTable Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #0284c7; --bg: #f8fafc; --card: #ffffff; --text: #334155; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        nav { background: var(--primary); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        nav a { color: #f8fafc; text-decoration: none; margin: 0 10px; font-weight: bold; font-size: 0.9rem; }
        nav a.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; padding-bottom: 3px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1, h2 { color: var(--primary); }
        h1 { text-align: center; font-size: 1.5rem; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        label { font-size: 0.75rem; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
        input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .results { padding: 15px; background: #f0f9ff; border-radius: 8px; border: 1px solid #bae6fd; margin-bottom: 20px; }
        .res-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #e0f2fe; font-size: 0.9rem; }
        .val { font-weight: bold; color: #0c4a6e; }
        button { background: #10b981; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">1. Load Audit</a>
    <a href="strings.html">2. Strings & Cables</a>
    <a href="financials.html" class="active">3. Financials & PDF</a>
</nav>

<div class="container">
    <h1>Page 3: Financial ROI & Official Audit PDF Export</h1>

    <div class="grid">
        <div>
            <label>Client Name</label>
            <input type="text" id="clientName" value="John Doe">
        </div>
        <div>
            <label>Project Site / Address</label>
            <input type="text" id="siteAddr" value="Lagos, Nigeria">
        </div>
        <div>
            <label>Utility Tariff Rate ($/kWh)</label>
            <input type="number" id="tariff" value="0.20" step="0.01" onchange="calcROI()">
        </div>
        <div>
            <label>Est. Total System Cost ($)</label>
            <input type="number" id="systemCost" value="3500" onchange="calcROI()">
        </div>
    </div>

    <div class="results">
        <div class="res-row"><span>Annual Electricity Generated:</span> <span class="val" id="annualKwh">0 kWh/yr</span></div>
        <div class="res-row"><span>Estimated Annual Financial Savings:</span> <span class="val" id="annualSavings">$0 / yr</span></div>
        <div class="res-row"><span>Simple Payback Period:</span> <span class="val" id="payback">0 Years</span></div>
        <div class="res-row"><span>Annual Carbon Offset (CO₂):</span> <span class="val" id="co2">0 Metric Tons</span></div>
    </div>

    <button onclick="generatePDF()">📄 Export Official Solar Engineering Audit (PDF)</button>
</div>

<script>
    let auditData = JSON.parse(localStorage.getItem('solar_audit_data')) || {};

    function calcROI() {
        const dailyWh = auditData.dailyWh || 5000;
        const tariff = parseFloat(document.getElementById('tariff').value) || 0.20;
        const cost = parseFloat(document.getElementById('systemCost').value) || 3500;

        const annualKwh = (dailyWh * 365) / 1000;
        const annualSavings = annualKwh * tariff;
        const payback = cost / (annualSavings || 1);
        const co2Tons = (annualKwh * 0.85) / 1000; // 0.85 kg CO2 per kWh grid factor

        document.getElementById('annualKwh').innerText = annualKwh.toFixed(0) + " kWh/yr";
        document.getElementById('annualSavings').innerText = "$" + annualSavings.toFixed(2) + " / yr";
        document.getElementById('payback').innerText = payback.toFixed(1) + " Years";
        document.getElementById('co2').innerText = co2Tons.toFixed(2) + " Tons CO₂/yr";

        auditData.annualKwh = annualKwh.toFixed(0);
        auditData.annualSavings = annualSavings.toFixed(2);
        auditData.payback = payback.toFixed(1);
        auditData.co2 = co2Tons.toFixed(2);
    }

    calcROI();

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const client = document.getElementById('clientName').value;
        const site = document.getElementById('siteAddr').value;

        // PDF Header Title
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 210, 30, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(16);
        doc.text("SOLAR ENGINEERING AUDIT REPORT", 15, 18);

        // Client Info
        doc.setTextColor(30, 41, 59);
        doc.setFontSize(10);
        doc.text(`Client Name: ${client}`, 15, 40);
        doc.text(`Site Address: ${site}`, 15, 46);
        doc.text(`Audit Date: ${new Date().toLocaleDateString()}`, 150, 40);

        // Summary Table
        doc.autoTable({
            startY: 55,
            head: [['System Parameter', 'Engineering Specification']],
            body: [
                ['Total Daily Energy Demand', `${(auditData.dailyWh/1000 || 0).toFixed(2)} kWh/day`],
                ['Continuous Peak Load', `${Math.round(auditData.runningW || 0)} W`],
                ['Recommended Inverter Rating', `${auditData.invKva || 0} kVA`],
                ['System DC Voltage Bus', `${auditData.sysV || 0} V DC`],
                ['Battery Bank Requirement', `${auditData.batAh || 0} Ah`],
                ['Solar Array Sizing', `${auditData.pvWp || 0} Wp (${auditData.stringConfig || 'Standard Strings'})`],
                ['PV DC Array Cable (Min Area)', `${auditData.pvCable || '4 mm²'}`],
                ['Battery to Inverter Cable', `${auditData.batCable || '25 mm²'}`],
                ['Estimated Payback Timeline', `${auditData.payback || 0} Years`],
                ['Annual CO2 Offset', `${auditData.co2 || 0} Metric Tons`]
            ],
            theme: 'grid',
            headStyles: { fillColor: [2, 132, 199] }
        });

        // Signoff Footer
        const finalY = doc.lastAutoTable.finalY + 30;
        doc.text("Engineered & Certified By: ___________________________", 15, finalY);
        doc.text("Client Sign-off: ___________________________", 120, finalY);

        doc.save(`Solar_Audit_${client.replace(/\s+/g, '_')}.pdf`);
    }
</script>
</body>
</html>
